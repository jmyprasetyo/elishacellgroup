<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF9F7">
<title>Prayers — Cell of St. Elisha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAF9F7;
    --surface: #FFFFFF;
    --ink: #1F1A17;
    --muted: #7C746C;
    --accent: #7B2D3B;
    --accent-soft: #F6ECEE;
    --border: #ECE8E2;
    --shadow: 0 1px 2px rgba(31, 26, 23, 0.04), 0 4px 16px rgba(31, 26, 23, 0.04);
    --shadow-hover: 0 2px 4px rgba(31, 26, 23, 0.05), 0 10px 28px rgba(123, 45, 59, 0.10);
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  main {
    max-width: 30rem;
    margin: 0 auto;
    padding:
      calc(1.5rem + env(safe-area-inset-top))
      calc(1.25rem + env(safe-area-inset-right))
      calc(3rem + env(safe-area-inset-bottom))
      calc(1.25rem + env(safe-area-inset-left));
  }

  .back {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    min-height: 2.75rem;
    padding: 0 0.25rem;
    color: var(--accent);
    font-size: 0.95rem;
    font-weight: 500;
    text-decoration: none;
  }

  .back:active { opacity: 0.6; }

  header {
    margin: 0.75rem 0 2rem;
    text-align: center;
  }

  .eyebrow {
    display: inline-block;
    margin: 0 0 1rem;
    padding: 0.4rem 1rem;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border-radius: 999px;
  }

  h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 600;
    font-size: clamp(2.2rem, 10vw, 3rem);
    letter-spacing: -0.02em;
    line-height: 1.1;
    margin: 0;
  }

  ul {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 0.85rem;
  }

  .card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    min-height: 4.5rem;
    padding: 1.1rem 1.25rem 1.1rem 1.5rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow);
    color: var(--ink);
    text-decoration: none;
    transition: transform 0.15s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  }

  .card h2 {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 500;
    font-size: 1.3rem;
    margin: 0;
  }

  .arrow {
    flex: 0 0 2.5rem;
    width: 2.5rem;
    height: 2.5rem;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 1.1rem;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .card:active {
    transform: scale(0.98);
    border-color: #E2C9CE;
  }

  .card:active .arrow {
    background: var(--accent);
    color: #fff;
  }

  @media (hover: hover) {
    .card:hover {
      transform: translateY(-2px);
      border-color: #E2C9CE;
      box-shadow: var(--shadow-hover);
    }
    .card:hover .arrow {
      background: var(--accent);
      color: #fff;
    }
  }

  .card:focus-visible,
  .back:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 16px;
  }

  @media (prefers-reduced-motion: reduce) {
    .card, .arrow { transition: none; }
    .card:active, .card:hover { transform: none; }
  }
</style>
</head>
<body>
<main>
  <a class="back" href="index.html">← Home</a>

  <header>
    <p class="eyebrow">Cell of St. Elisha</p>
    <h1>Prayers</h1>
  </header>

  <ul>
    <li>
      <a class="card" href="../prayers/doa-penyerahan.html">
        <h2>Doa Penyerahan</h2>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </li>
    <li>
      <a class="card" href="../prayers/doa-htc40.html">
        <h2>Doa HTC40</h2>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </li>
  </ul>
</main>
</body>
</html>
