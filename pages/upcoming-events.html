<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF9F7">
<title>Upcoming Events — Cell of St. Elisha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAF9F7;
    --surface: #FFFFFF;
    --ink: #1F1A17;
    --muted: #7C746C;
    --accent: #7B2D3B;
    --accent-soft: #F6ECEE;
    --border: #ECE8E2;
    --shadow: 0 1px 2px rgba(31, 26, 23, 0.04), 0 4px 16px rgba(31, 26, 23, 0.04);
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  main {
    max-width: 30rem;
    margin: 0 auto;
    padding:
      calc(1.5rem + env(safe-area-inset-top))
      calc(1.25rem + env(safe-area-inset-right))
      calc(3rem + env(safe-area-inset-bottom))
      calc(1.25rem + env(safe-area-inset-left));
  }

  .back {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    min-height: 2.75rem;
    padding: 0 0.25rem;
    color: var(--accent);
    font-size: 0.95rem;
    font-weight: 500;
    text-decoration: none;
  }

  .back:active { opacity: 0.6; }

  header {
    margin: 0.75rem 0 2rem;
    text-align: center;
  }

  .eyebrow {
    display: inline-block;
    margin: 0 0 1rem;
    padding: 0.4rem 1rem;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border-radius: 999px;
  }

  h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 600;
    font-size: clamp(2.2rem, 10vw, 3rem);
    letter-spacing: -0.02em;
    line-height: 1.1;
    margin: 0;
  }

  ul {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 0.85rem;
  }

  .card {
    display: flex;
    align-items: flex-start;
    gap: 1rem;
    padding: 1rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow);
  }

  .poster {
    flex: 0 0 5rem;
    width: 5rem;
    height: 5rem;
    border-radius: 10px;
    border: 1px solid var(--border);
    overflow: hidden;
    background: var(--accent-soft);
  }

  .poster img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .event {
    flex: 1 1 auto;
    min-width: 0;
  }

  .event h2 {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 500;
    font-size: 1.2rem;
    line-height: 1.25;
    margin: 0.1rem 0 0.3rem;
  }

  .when {
    margin: 0 0 0.8rem;
    color: var(--muted);
    font-size: 0.9rem;
    line-height: 1.4;
  }

  .link {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    min-height: 2.5rem;
    padding: 0 1rem;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 0.9rem;
    font-weight: 600;
    text-decoration: none;
    border-radius: 999px;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .link:active {
    background: var(--accent);
    color: #fff;
  }

  @media (hover: hover) {
    .link:hover {
      background: var(--accent);
      color: #fff;
    }
  }

  .link:focus-visible,
  .back:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 999px;
  }

  footer {
    margin-top: 2rem;
    text-align: center;
    color: var(--muted);
    font-size: 0.9rem;
  }

  @media (prefers-reduced-motion: reduce) {
    .link { transition: none; }
  }
</style>
</head>
<body>
<main>
  <a class="back" href="index.html">← Home</a>

  <header>
    <p class="eyebrow">Cell of St. Elisha</p>
    <h1>Upcoming events</h1>
  </header>

  <ul>
    <li class="card">
      <div class="poster"><img src="images/walkwithchrist.jpeg" alt="Walk with Christ"></div>
      <div class="event">
        <h2>Walk with Christ</h2>
        <p class="when">November 22nd, 1 PM - finish</p>
        <a class="link" href="https://maps.app.goo.gl/g9xSCKRpExvH9qDy5">Meeting point <span aria-hidden="true">↗</span></a>
      </div>
    </li>
    <li class="card">
      <div class="poster"><img src="images/htc40.jpeg" alt="HTC 40th Anniversary"></div>
      <div class="event">
        <h2>HTC 40th Anniversary</h2>
        <p class="when">February 13th, TBD</p>
        <a class="link" href="https://maps.app.goo.gl/eAWKJqk3WrnUovmF7">TBD <span aria-hidden="true">↗</span></a>
      </div>
    </li>
  </ul>

  <footer>
    Check back for updates.
  </footer>
</main>
</body>
</html>
