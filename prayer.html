<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Cell Prayer — Cell of St. Elisha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F6EFDF;
    --ink: #2B2118;
    --muted: #7A6A54;
    --accent: #7B2D3B;
    --gold: #B98431;
    --rule: #DFD0AC;
    --paper: #FFFDF7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
  }
  main {
    max-width: 34rem;
    margin: 0 auto;
    padding: 3rem 1.5rem 4rem;
  }
  .back-link {
    display: inline-block;
    font-size: 0.9rem;
    font-weight: 500;
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid currentColor;
    padding-bottom: 1px;
    margin-bottom: 1.75rem;
  }
  .back-link:hover { color: var(--gold); }
  header {
    padding-bottom: 1.75rem;
    margin-bottom: 1.75rem;
    border-bottom: 1px solid var(--rule);
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 2.1rem;
    letter-spacing: -0.01em;
    margin: 0 0 0.35rem;
  }
  .sub {
    margin: 0;
    color: var(--accent);
    font-size: 1rem;
    font-weight: 500;
  }
  .prayer {
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 1.75rem 1.5rem;
    font-family: 'Fraunces', serif;
    font-size: 1.1rem;
    line-height: 1.75;
  }
  .prayer p { margin: 0 0 1.2rem; }
  .prayer p:last-child { margin-bottom: 0; }
  .placeholder {
    color: var(--muted);
    font-family: 'IBM Plex Sans', sans-serif;
    font-style: italic;
    font-size: 0.95rem;
  }
  footer {
    margin-top: 2.5rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--rule);
    color: var(--muted);
    font-size: 0.85rem;
  }
</style>
</head>
<body>
<main>
  <a class="back-link" href="index.html">← Back to events</a>

  <header>
    <h1>Our Cell Prayer</h1>
    <p class="sub">Cell of St. Elisha</p>
  </header>

  <div class="prayer">
    <!-- Replace this placeholder with the actual prayer text.
         Wrap each paragraph or line in its own <p>...</p> tag. -->
    <p class="placeholder">Prayer text goes here. Replace this paragraph
      (and add more &lt;p&gt; tags as needed) with the full prayer.</p>
  </div>

  <footer>
    Cell of St. Elisha
  </footer>
</main>
</body>
</html>
